name: Export APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-main
  cancel-in-progress: true

jobs:
  export:
    name: Build arm32 APK (armeabi-v7a)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build APK (arm32)
        run: flutter build apk --release --target-platform android-arm

      - name: Prepare output
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/GetTube-arm32-r${{ github.run_number }}.apk"
          ls -la dist/

      # Primary export: GitHub Release (does NOT consume Actions storage quota)
      - name: Export to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GetTube build ${{ github.run_number }}
          files: dist/*.apk
          body: |
            🚀 **GetTube build ${{ github.run_number }}**

            - APK: **arm32 (armeabi-v7a)** — release build
            - كل الجودات مجاناً: 144p حتى 8K — بدون اشتراك وبدون جدار دفع
            - دمج تلقائي للصوت مع الفيديو (DASH) + تحويل MP3

            > حمّل ملف `GetTube-arm32-r*.apk` من قسم Assets تحت 👇
          make_latest: true

      # Secondary: artifact with short retention so it never fills Actions storage
      - name: Upload artifact (7 days retention)
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GetTube-arm32-APK
          path: dist/*.apk
          retention-days: 7
