name: Export APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-main
  cancel-in-progress: true

jobs:
  export:
    name: Build APK (universal)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Decode stable release keystore (GitHub Secrets)
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      # Single universal APK: arm32 (old phones) + arm64 (modern/64-bit-only
      # phones) + x86_64 (emulators, Chromebooks). One file for every device.
      # Same FIXED release key => installs over any previous GetTube build.
      - name: "Build APK (universal: arm32 + arm64 + x86_64)"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64 -Puniversal=true

      # Same keystore => same SHA256 on every build. This line lets us prove
      # signature consistency across builds (updates install over old ones).
      - name: Print signing certificate SHA256
        run: keytool -list -v -keystore android/app/upload-keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>/dev/null | grep SHA256 || true

      - name: Prepare output
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "dist/GetTube-universal-r${{ github.run_number }}.apk"
          ls -la dist/

      # Primary export: GitHub Release (does NOT consume Actions storage quota)
      - name: Export to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GetTube build ${{ github.run_number }}
          files: dist/*.apk
          body: |
            🚀 **GetTube build ${{ github.run_number }}

            - ملف واحد للتحميل: `GetTube-universal-r*.apk` — **يشتغل على أي جهاز حديث أو قديم**
            - كل الجودات مجاناً: من 144p حتى 8K — بدون اشتراك
            - الفيديو والصوت في ملف واحد جاهز للمشاركة + إمكانية تحويل MP3
            - التحديثات الجديدة تُثبَّت فوق القديمة مباشرة بدون حذف التطبيق

            > حمّل ملف APK من قسم Assets تحت 👇
          make_latest: true

      # Secondary: artifact with short retention so it never fills Actions storage
      - name: Upload artifact (7 days retention)
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GetTube-APK
          path: dist/*.apk
          retention-days: 7
